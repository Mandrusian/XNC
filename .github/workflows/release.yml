name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "XNC $TAG" --generate-notes
          fi

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install WebView2 SDK via NuGet
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory windows/packages -ExcludeVersion
      - name: Build Windows Release Binary
        run: |
          cmake -S windows -B windows/build
          cmake --build windows/build --config Release
          $bin = Get-Item windows/build/Release/xnc.exe
          Write-Host "Windows binary size: $($bin.Length) bytes"
      - name: Bundle Portable SearXNG Runtime
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File scripts\bundle-searxng-windows.ps1 -OutDir windows\searxng-runtime
      - name: Build Zero-UAC Setup EXE (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc windows\installer.iss
          Get-ChildItem windows\dist
      - name: Package Portable Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage\XNC\shared -Force | Out-Null
          Copy-Item windows\build\Release\xnc.exe stage\XNC\xnc.exe
          Copy-Item shared\* stage\XNC\shared\ -Recurse
          Copy-Item windows\searxng-runtime stage\XNC\searxng-runtime -Recurse
          Compress-Archive -Path stage\XNC\* -DestinationPath XNC-windows-x64.zip -Force
      - name: Upload Windows Release Assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" windows/dist/XNC-Setup.exe XNC-windows-x64.zip --clobber

  macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Bundle Portable SearXNG Runtime
        run: |
          chmod +x scripts/bundle-searxng-macos.sh
          ./scripts/bundle-searxng-macos.sh macos/searxng-runtime
      - name: Package macOS XNC.app
        run: |
          cd macos
          chmod +x scripts/package_app.sh
          ./scripts/package_app.sh
          cd dist
          ditto -c -k --sequesterRsrc --keepParent XNC.app ../../XNC-macos-arm64.zip
      - name: Upload macOS Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" XNC-macos-arm64.zip --clobber

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 and WebKit2GTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build Linux XNC Binary & Tarball
        run: |
          cmake -S linux -B linux/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build
          mkdir -p stage/xnc/shared
          cp linux/build/xnc stage/xnc/xnc
          cp -r shared/* stage/xnc/shared/
          tar -czf XNC-linux-x64.tar.gz -C stage xnc
      - name: Upload Linux Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" XNC-linux-x64.tar.gz --clobber
