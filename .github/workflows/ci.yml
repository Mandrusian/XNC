name: SNC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run C++ core tests
        run: |
          cmake -S core -B core/build
          cmake --build core/build
          ctest --test-dir core/build --output-on-failure
      - name: Run Swift tests & package SNC.app
        run: |
          cd macos
          swift test
          chmod +x scripts/package_app.sh
          ./scripts/package_app.sh
          SIZE_BYTES=$(stat -f%z dist/SNC.app/Contents/MacOS/SNC)
          echo "macOS binary size: $SIZE_BYTES bytes"
          test "$SIZE_BYTES" -lt 20971520

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK3 and WebKit2GTK 4.1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Run C++ core tests
        run: |
          cmake -S core -B core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build
          ctest --test-dir core/build --output-on-failure
      - name: Build Linux SNC browser
        run: |
          cmake -S linux -B linux/build -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build
          ls -lh linux/build/snc
          SIZE_BYTES=$(stat -c%s linux/build/snc)
          echo "Linux binary size: $SIZE_BYTES bytes"
          test "$SIZE_BYTES" -lt 20971520

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebView2 SDK via NuGet
        run: nuget install Microsoft.Web.WebView2 -OutputDirectory windows/packages -ExcludeVersion
      - name: Run C++ core tests
        run: |
          cmake -S core -B core/build
          cmake --build core/build --config Release
          ctest --test-dir core/build -C Release --output-on-failure
      - name: Build Windows SNC browser
        run: |
          cmake -S windows -B windows/build
          cmake --build windows/build --config Release
          $bin = Get-Item windows/build/Release/snc.exe
          Write-Host "Windows binary size: $($bin.Length) bytes"
          if ($bin.Length -ge 20971520) { exit 1 }
