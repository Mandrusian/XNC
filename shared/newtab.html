<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Tab</title>
<style>
  :root {
    --bg: #000000;
    --surface: #0b0b0c;
    --surface-hover: #141417;
    --panel: #0b0b0d;
    --border: rgba(255, 255, 255, 0.085);
    --border-focus: rgba(255, 255, 255, 0.28);
    --text: #ffffff;
    --text-2: rgba(255, 255, 255, 0.56);
    --text-3: rgba(255, 255, 255, 0.28);
    --flow: cubic-bezier(0.16, 1, 0.3, 1);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", "Cascadia Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    transition: background 0.55s var(--flow);
  }

  /* Transparent Mica / Liquid Glass compatibility */
  body.mica {
    --surface: rgba(255, 255, 255, 0.045);
    --surface-hover: rgba(255, 255, 255, 0.09);
    --panel: rgba(12, 12, 14, 0.86);
    --border: rgba(255, 255, 255, 0.095);
    background: transparent !important;
  }
  body.mica.standalone {
    background: #0d0e11 !important;
  }

  .hidden { display: none !important; }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 28px 80px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(14px);
    transition: opacity 0.52s var(--flow), transform 0.68s var(--flow);
  }
  .view.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  /* Flat Matte Search Bar */
  .search-wrap {
    position: relative;
    width: 100%;
    max-width: 520px;
    transition: max-width 0.62s var(--flow);
  }
  .search-wrap:focus-within { max-width: 576px; }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    height: 46px;
    padding: 0 12px 0 14px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.42s var(--flow), background 0.42s var(--flow);
  }
  .search-bar:focus-within {
    background: var(--surface-hover);
    border-color: var(--border-focus);
  }

  .engine-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-2);
    font: 500 12.5px/1 var(--sans);
    padding: 6px 10px 6px 0;
    border-right: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.35s var(--flow);
  }
  .engine-btn:hover { color: var(--text); }

  .search-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: 400 14.5px/1.2 var(--sans);
  }
  .search-input::placeholder { color: var(--text-3); }

  .intent-tag {
    font: 500 10px/1 var(--mono);
    color: var(--text-3);
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }

  .submit-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-3);
    font: 400 16px/1 var(--sans);
    padding: 6px;
    cursor: pointer;
    flex-shrink: 0;
    transition: color 0.35s var(--flow), transform 0.5s var(--flow);
  }
  .submit-btn:hover { color: var(--text); transform: translateX(2px); }

  /* Inline SearXNG Popover */
  .searx-pop {
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    z-index: 30;
    padding: 14px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.36s var(--flow), transform 0.48s var(--flow);
  }
  .searx-pop.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .searx-row { display: flex; align-items: center; gap: 8px; }
  .field {
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #000;
    color: #fff;
    padding: 0 10px;
    font: 400 12.5px/1 var(--sans);
    outline: 0;
    transition: border-color 0.3s var(--flow);
  }
  .field:focus { border-color: var(--border-focus); }
  .field.mono { font-family: var(--mono); }
  .flat-btn {
    appearance: none;
    height: 34px;
    padding: 0 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    font: 500 12px/1 var(--sans);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.32s var(--flow), color 0.32s var(--flow);
  }
  .flat-btn:hover { background: var(--surface-hover); color: #fff; }
  .flat-btn.primary { background: #fff; color: #000; border-color: #fff; }
  .flat-btn.primary:hover { background: #e4e4e7; color: #000; }
  .searx-meta {
    margin-top: 9px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-3);
  }

  /* LAYOUT 1: MINIMAL */
  .xnc-wordmark {
    width: 46px;
    height: auto;
    margin-bottom: 18px;
    opacity: 0.92;
    transition: opacity 0.5s var(--flow), transform 0.6s var(--flow);
  }
  .xnc-wordmark:hover { opacity: 1; transform: translateY(-1px); }

  .clock-hero {
    font-size: clamp(62px, 9.5vw, 98px);
    font-weight: 200;
    letter-spacing: -0.055em;
    font-variant-numeric: tabular-nums;
    line-height: 0.94;
    margin-bottom: 10px;
  }
  .date-line {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 32px;
    font-weight: 500;
  }

  /* Flowy rAF Glide Links Bar */
  .glide-nav {
    position: relative;
    margin-top: 24px;
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    padding: 4px;
  }
  .glide-pill {
    position: absolute;
    top: 4px;
    left: 0;
    height: 30px;
    border-radius: 8px;
    background: var(--surface-hover);
    opacity: 0;
    pointer-events: none;
    will-change: transform, width, opacity;
  }
  .glide-link {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-2);
    font: 400 12.5px/1 var(--sans);
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
    transition: color 0.4s var(--flow);
    white-space: nowrap;
  }
  .glide-link:hover { color: var(--text); }
  .glide-sep {
    width: 1px;
    height: 12px;
    background: var(--border);
    margin: 0 4px;
  }

  /* LAYOUT 2: STUDIO */
  .studio-shell {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
  }
  .studio-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 20px;
    min-height: 44px;
  }
  .studio-brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .studio-mark { width: 40px; height: auto; opacity: 0.92; }
  .studio-clock {
    font-size: 38px;
    font-weight: 300;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .studio-sub {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-top: 6px;
  }
  .subtle-link {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-3);
    font: 400 12px/1 var(--sans);
    padding: 6px 2px;
    cursor: pointer;
    transition: color 0.4s var(--flow);
  }
  .subtle-link:hover { color: var(--text); }

  .studio-actions {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding-left: 2px;
  }

  .studio-grid {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .tile {
    appearance: none;
    text-align: left;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.45s var(--flow), border-color 0.45s var(--flow), transform 0.55s var(--flow);
  }
  .tile:hover {
    background: var(--surface-hover);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }
  .tile-k { font: 500 10px/1 var(--mono); color: var(--text-3); letter-spacing: 0.08em; }
  .tile-t { font: 500 13.5px/1.2 var(--sans); margin: 9px 0 3px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-d { font: 400 11px/1.3 var(--sans); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Bottom-Right Controls + Settings Icon */
  .corner-bar {
    position: fixed;
    right: 20px;
    bottom: 16px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 10px;
    font: 400 11.5px/1 var(--sans);
  }
  .seg-btn {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-3);
    font: inherit;
    padding: 6px 3px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.35s var(--flow), transform 0.45s var(--flow);
  }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.active { color: var(--text); }
  .seg-dot { color: var(--text-3); font-size: 10px; }
  .gear-btn {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    justify-content: center;
    padding: 0;
  }
  .gear-btn svg { transition: transform 0.6s var(--flow); }
  .gear-btn.open svg { transform: rotate(45deg); color: var(--text); }

  /* Modular Settings Drawer */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.38s var(--flow);
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

  .settings-drawer {
    position: fixed;
    right: 20px;
    bottom: 54px;
    z-index: 65;
    width: min(360px, calc(100vw - 40px));
    max-height: calc(100vh - 84px);
    overflow-y: auto;
    padding: 16px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(24px);
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px) scale(0.98);
    transition: opacity 0.38s var(--flow), transform 0.55s var(--flow);
  }
  .settings-drawer.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
  }
  .sd-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .sd-title { font: 500 13px/1 var(--sans); color: #fff; letter-spacing: 0.01em; }
  .sd-sec {
    padding-top: 12px;
    margin-top: 12px;
    border-top: 1px solid var(--border);
  }
  .sd-sec-label {
    font: 500 10px/1 var(--mono);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .seg-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .choice-btn {
    appearance: none;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font: 400 12px/1 var(--sans);
    cursor: pointer;
    transition: all 0.35s var(--flow);
  }
  .choice-btn:hover { color: #fff; border-color: rgba(255, 255, 255, 0.16); }
  .choice-btn.active {
    background: rgba(255, 255, 255, 0.10);
    border-color: rgba(255, 255, 255, 0.24);
    color: #fff;
    font-weight: 500;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    font: 400 12.5px/1.2 var(--sans);
    color: var(--text-2);
  }
  .switch {
    position: relative;
    width: 34px;
    height: 19px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.10);
    cursor: pointer;
    transition: background 0.38s var(--flow);
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.65);
    transition: transform 0.42s var(--flow), background 0.35s var(--flow);
  }
  .switch.on { background: rgba(255, 255, 255, 0.9); }
  .switch.on::after { transform: translateX(15px); background: #000; }

  /* Modular Favorites Editor */
  .fav-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .fav-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
  }
  .fav-info { flex: 1; min-width: 0; }
  .fav-t { font: 500 12px/1.2 var(--sans); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-u { font: 400 10.5px/1.2 var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-xs {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-3);
    font: 500 12px/1 var(--sans);
    padding: 4px 5px;
    cursor: pointer;
    border-radius: 5px;
    transition: color 0.25s ease, background 0.25s ease;
  }
  .icon-xs:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .fav-add { display: grid; grid-template-columns: 1fr 1.3fr auto; gap: 6px; }

  .toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    z-index: 80;
    padding: 8px 14px;
    border-radius: 8px;
    background: #0c0c0e;
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-2);
    font: 400 12px/1.2 var(--sans);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s var(--flow), transform 0.45s var(--flow);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .studio-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <main class="stage">
    <!-- LAYOUT 1: MINIMAL -->
    <section class="view active" id="view-minimal">
      <svg class="xnc-wordmark" data-mod="logo" viewBox="240 240 544 544" aria-hidden="true">
        <g fill="#FFFFFF">
          <polygon points="252,252 288,252 404,772 368,772"/>
          <polygon points="368,252 404,252 288,772 252,772"/>
          <rect x="436" y="252" width="30" height="520"/>
          <rect x="558" y="252" width="30" height="520"/>
          <polygon points="436,252 468,252 588,772 556,772"/>
          <path d="M 757 355 L 757 308 Q 757 267 696 267 Q 635 267 635 308 L 635 716 Q 635 757 696 757 Q 757 757 757 716 L 757 669"
                fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="butt"/>
        </g>
      </svg>

      <div class="clock-hero" data-mod="clock" data-clock>18:46</div>
      <div class="date-line" data-mod="date" data-date>FRIDAY, NOVEMBER 27</div>

      <div class="search-wrap" data-search-wrap>
        <form class="search-bar" data-search-form>
          <button type="button" class="engine-btn" data-toggle-searx>
            <span data-engine-label>SearXNG</span>
          </button>
          <input class="search-input" data-search-input placeholder="Search or enter address" autocomplete="off" />
          <button type="submit" class="submit-btn" aria-label="Go">→</button>
        </form>
        <div class="searx-pop" data-searx-pop></div>
      </div>

      <nav class="glide-nav" id="glideNav" aria-label="Favorites &amp; Actions">
        <div class="glide-pill" id="glidePill"></div>
      </nav>
    </section>

    <!-- LAYOUT 2: STUDIO -->
    <section class="view" id="view-studio">
      <div class="studio-shell">
        <div class="studio-top">
          <div class="studio-brand">
            <svg class="studio-mark" data-mod="logo" viewBox="240 240 544 544" aria-hidden="true">
              <g fill="#FFFFFF">
                <polygon points="252,252 288,252 404,772 368,772"/>
                <polygon points="368,252 404,252 288,772 252,772"/>
                <rect x="436" y="252" width="30" height="520"/>
                <rect x="558" y="252" width="30" height="520"/>
                <polygon points="436,252 468,252 588,772 556,772"/>
                <path d="M 757 355 L 757 308 Q 757 267 696 267 Q 635 267 635 308 L 635 716 Q 635 757 696 757 Q 757 757 757 716 L 757 669"
                      fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="butt"/>
              </g>
            </svg>
            <div>
              <div class="studio-clock" data-mod="clock" data-clock>18:46</div>
              <div class="studio-sub" data-mod="date" data-date>FRIDAY, NOVEMBER 27</div>
            </div>
          </div>
          <button class="subtle-link" data-open-searx id="studioEngineHint">SearXNG</button>
        </div>

        <div class="search-wrap" style="max-width:100%" data-search-wrap>
          <form class="search-bar" data-search-form>
            <button type="button" class="engine-btn" data-toggle-searx>
              <span data-engine-label>SearXNG</span>
            </button>
            <input class="search-input" id="studioInput" data-search-input placeholder="Search, URL, or magnet: link" autocomplete="off" />
            <span class="intent-tag" id="studioIntent">SEARXNG</span>
            <button type="submit" class="submit-btn" aria-label="Go">→</button>
          </form>
          <div class="searx-pop" data-searx-pop></div>
        </div>

        <div class="studio-actions" data-mod="actions">
          <button class="subtle-link" data-act="newPrivateTab">Private Tab</button>
          <button class="subtle-link" data-act="zapper">Element Zapper</button>
          <button class="subtle-link" data-act="fullscreen">F11 Fullscreen</button>
          <button class="subtle-link" data-open-searx>Configure SearXNG</button>
        </div>

        <div class="studio-grid" id="studioGrid" data-mod="favorites"></div>
      </div>
    </section>
  </main>

  <!-- Quiet Bottom-Right Controls + Modular Settings Gear -->
  <div class="corner-bar">
    <button class="seg-btn active" data-layout="minimal">Minimal</button>
    <span class="seg-dot">·</span>
    <button class="seg-btn" data-layout="studio">Studio</button>
    <span class="seg-dot">|</span>
    <button class="seg-btn gear-btn" id="settingsBtn" aria-label="Customize New Tab" title="Customize New Tab">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Modular Customization Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="settings-drawer" id="settingsDrawer" aria-label="New Tab Settings">
    <div class="sd-head">
      <span class="sd-title">Customize Start Page</span>
      <button class="icon-xs" id="closeDrawerBtn" aria-label="Close">✕</button>
    </div>

    <div class="sd-sec" style="margin-top:0;padding-top:0;border-top:0;">
      <div class="sd-sec-label"><span>Layout &amp; Surface</span></div>
      <div class="seg-group" style="margin-bottom:8px;">
        <button class="choice-btn" data-layout="minimal">Minimal</button>
        <button class="choice-btn" data-layout="studio">Studio</button>
      </div>
      <div class="seg-group">
        <button class="choice-btn" id="bgBlackBtn">#000 Black</button>
        <button class="choice-btn" id="bgMicaBtn">Mica Glass</button>
      </div>
    </div>

    <div class="sd-sec">
      <div class="sd-sec-label"><span>Modules</span></div>
      <div class="toggle-row"><span>Show XNC Logo</span><button class="switch" data-pref="showLogo"></button></div>
      <div class="toggle-row"><span>Show Clock</span><button class="switch" data-pref="showClock"></button></div>
      <div class="toggle-row"><span>24-Hour Time</span><button class="switch" data-pref="hour24"></button></div>
      <div class="toggle-row"><span>Show Seconds</span><button class="switch" data-pref="showSeconds"></button></div>
      <div class="toggle-row"><span>Show Date</span><button class="switch" data-pref="showDate"></button></div>
      <div class="toggle-row"><span>Show Favorites</span><button class="switch" data-pref="showFavorites"></button></div>
      <div class="toggle-row"><span>Show Quick Actions</span><button class="switch" data-pref="showActions"></button></div>
    </div>

    <div class="sd-sec">
      <div class="sd-sec-label">
        <span>Favorites</span>
        <button class="icon-xs" id="resetFavsBtn">Reset</button>
      </div>
      <div class="fav-list" id="favEditorList"></div>
      <form class="fav-add" id="favAddForm">
        <input class="field" id="favTitleIn" placeholder="Name" autocomplete="off" />
        <input class="field mono" id="favUrlIn" placeholder="https://..." autocomplete="off" />
        <button class="flat-btn primary" type="submit">Add</button>
      </form>
    </div>

    <div class="sd-sec">
      <div class="sd-sec-label"><span>SearXNG Search</span></div>
      <div class="searx-row" style="margin-bottom:6px;">
        <input class="field mono" id="sdSearxIn" style="flex:1" placeholder="http://localhost:8080" />
        <button class="flat-btn primary" id="sdSearxSave">Save</button>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="flat-btn" style="flex:1" id="sdSearx8080">Local :8080</button>
        <button class="flat-btn" style="flex:1" id="sdSearxDDG">DuckDuckGo</button>
      </div>
    </div>
  </aside>

<script>
(() => {
  const DEFAULT_FAVS = [
    { title: 'GitHub', url: 'https://github.com/Mandrusian/XNC' },
    { title: 'Hacker News', url: 'https://news.ycombinator.com' },
    { title: 'Wikipedia', url: 'https://wikipedia.org' },
    { title: 'Arch Wiki', url: 'https://wiki.archlinux.org' }
  ];
  const DEFAULT_PREFS = {
    layout: 'minimal',
    showLogo: true,
    showClock: true,
    hour24: true,
    showSeconds: false,
    showDate: true,
    showFavorites: true,
    showActions: true,
    mica: false,
    searxUrl: '',
    favorites: DEFAULT_FAVS
  };

  const PREFS_KEY = 'xnc.home.prefs.v1';
  function loadPrefs() {
    try {
      const raw = localStorage.getItem(PREFS_KEY);
      if (!raw) return structuredClone(DEFAULT_PREFS);
      const parsed = JSON.parse(raw);
      return {
        ...DEFAULT_PREFS,
        ...parsed,
        favorites: Array.isArray(parsed.favorites) ? parsed.favorites : structuredClone(DEFAULT_FAVS)
      };
    } catch {
      return structuredClone(DEFAULT_PREFS);
    }
  }
  function savePrefs() {
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
  }

  let prefs = loadPrefs();
  let isNative = Boolean(window.webkit?.messageHandlers?.xncHome || window.chrome?.webview);
  document.body.classList.toggle('standalone', !isNative);

  function xncSend(payload) {
    const json = JSON.stringify(payload);
    if (window.webkit?.messageHandlers?.xncHome) {
      window.webkit.messageHandlers.xncHome.postMessage(payload);
      return true;
    }
    if (window.chrome?.webview) {
      window.chrome.webview.postMessage(json);
      return true;
    }
    return false;
  }

  // Native host injects current SearXNG & Mica state here
  window.__xncApplyState = (state) => {
    if (!state || typeof state !== 'object') return;
    isNative = true;
    document.body.classList.remove('standalone');
    if (typeof state.searxngUrl === 'string') prefs.searxUrl = state.searxngUrl;
    if (typeof state.micaEnabled === 'boolean') prefs.mica = state.micaEnabled;
    savePrefs();
    renderAll();
  };

  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function hostOf(url) {
    try { return new URL(url).host.replace(/^www\./, ''); }
    catch { return url; }
  }

  function normalizeTargetURL(raw) {
    const t = raw.trim();
    if (!t) return '';
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(t)) return t;
    return 'https://' + t;
  }

  function navigateInput(raw) {
    const q = raw.trim();
    if (!q) return;
    if (xncSend({ type: 'navigate', input: q })) return;
    if (/^https?:\/\//i.test(q) || (q.includes('.') && !q.includes(' '))) {
      window.location.href = normalizeTargetURL(q);
    } else if (prefs.searxUrl) {
      const base = prefs.searxUrl.replace(/\/+$/, '');
      window.location.href = base.includes('{query}')
        ? base.replace('{query}', encodeURIComponent(q))
        : `${base}/search?q=${encodeURIComponent(q)}`;
    } else {
      window.location.href = `https://duckduckgo.com/?q=${encodeURIComponent(q)}`;
    }
  }

  function setSearxng(url) {
    prefs.searxUrl = url.trim();
    savePrefs();
    if (!xncSend({ type: 'setSearxng', url: prefs.searxUrl })) {
      showToast(prefs.searxUrl ? `SearXNG set to ${prefs.searxUrl}` : 'Switched to DuckDuckGo');
    }
    renderAll();
  }

  function setMica(enabled) {
    prefs.mica = Boolean(enabled);
    savePrefs();
    if (!xncSend({ type: 'setMica', enabled: prefs.mica })) {
      showToast(prefs.mica ? 'Mica Transparent' : '#000 Black');
    }
    renderAll();
  }

  function triggerAction(name) {
    if (!xncSend({ type: 'action', name })) {
      showToast(`Action: ${name}`);
    }
  }

  // Clock
  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    const sec = String(now.getSeconds()).padStart(2, '0');
    let suffix = '';
    if (!prefs.hour24) {
      suffix = h >= 12 ? ' PM' : ' AM';
      h = h % 12 || 12;
    }
    const hh = prefs.hour24 ? String(h).padStart(2, '0') : String(h);
    const timeStr = prefs.showSeconds ? `${hh}:${m}:${sec}${suffix}` : `${hh}:${m}${suffix}`;
    const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
    document.querySelectorAll('[data-clock]').forEach(el => el.textContent = timeStr);
    document.querySelectorAll('[data-date]').forEach(el => el.textContent = dateStr);
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Flowy rAF Glide Pill
  const glideNav = document.getElementById('glideNav');
  let glidePillRef = document.getElementById('glidePill');
  let curX = 0, curW = 60, curO = 0;
  let tgtX = 0, tgtW = 60, tgtO = 0;
  let glideAnimating = false;

  function stepGlide() {
    curX += (tgtX - curX) * 0.12;
    curW += (tgtW - curW) * 0.12;
    curO += (tgtO - curO) * 0.14;
    if (glidePillRef) {
      glidePillRef.style.transform = `translate3d(${curX.toFixed(2)}px, 0, 0)`;
      glidePillRef.style.width = `${curW.toFixed(2)}px`;
      glidePillRef.style.opacity = curO.toFixed(3);
    }
    if (Math.abs(tgtX - curX) > 0.15 || Math.abs(tgtW - curW) > 0.15 || Math.abs(tgtO - curO) > 0.01) {
      requestAnimationFrame(stepGlide);
    } else {
      glideAnimating = false;
    }
  }
  function kickGlide() {
    if (!glideAnimating) {
      glideAnimating = true;
      requestAnimationFrame(stepGlide);
    }
  }
  glideNav.addEventListener('mouseleave', () => { tgtO = 0; kickGlide(); });

  function renderFavorites() {
    glideNav.innerHTML = '<div class="glide-pill" id="glidePill"></div>';
    glidePillRef = document.getElementById('glidePill');
    const hasFavs = prefs.showFavorites && prefs.favorites.length > 0;
    if (hasFavs) {
      prefs.favorites.forEach(f => {
        const b = document.createElement('button');
        b.className = 'glide-link';
        b.textContent = f.title;
        b.addEventListener('click', () => navigateInput(f.url));
        glideNav.appendChild(b);
      });
    }
    if (hasFavs && prefs.showActions) {
      const sep = document.createElement('span');
      sep.className = 'glide-sep';
      glideNav.appendChild(sep);
    }
    if (prefs.showActions) {
      [['Private', 'newPrivateTab'], ['Zapper', 'zapper'], ['F11', 'fullscreen']].forEach(([label, act]) => {
        const b = document.createElement('button');
        b.className = 'glide-link';
        b.textContent = label;
        b.addEventListener('click', () => triggerAction(act));
        glideNav.appendChild(b);
      });
    }
    glideNav.classList.toggle('hidden', !hasFavs && !prefs.showActions);
    glideNav.querySelectorAll('.glide-link').forEach(item => {
      item.addEventListener('mouseenter', () => {
        if (curO < 0.02) {
          curX = item.offsetLeft;
          curW = item.offsetWidth;
        }
        glidePillRef.style.top = `${item.offsetTop}px`;
        glidePillRef.style.height = `${item.offsetHeight}px`;
        tgtX = item.offsetLeft;
        tgtW = item.offsetWidth;
        tgtO = 1;
        kickGlide();
      });
    });

    const grid = document.getElementById('studioGrid');
    grid.innerHTML = '';
    prefs.favorites.forEach(f => {
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.innerHTML = `<div class="tile-k">FAV</div><div class="tile-t"></div><div class="tile-d"></div>`;
      tile.querySelector('.tile-t').textContent = f.title;
      tile.querySelector('.tile-d').textContent = hostOf(f.url);
      tile.addEventListener('click', () => navigateInput(f.url));
      grid.appendChild(tile);
    });
    const addTile = document.createElement('button');
    addTile.className = 'tile';
    addTile.innerHTML = `<div class="tile-k">CONFIG</div><div class="tile-t">Customize</div><div class="tile-d">Favs, clock &amp; logo</div>`;
    addTile.addEventListener('click', openDrawer);
    grid.appendChild(addTile);

    const list = document.getElementById('favEditorList');
    list.innerHTML = '';
    prefs.favorites.forEach((f, idx) => {
      const row = document.createElement('div');
      row.className = 'fav-item';
      row.innerHTML = `
        <div class="fav-info"><div class="fav-t"></div><div class="fav-u"></div></div>
        <button class="icon-xs" type="button" title="Move up">↑</button>
        <button class="icon-xs" type="button" title="Move down">↓</button>
        <button class="icon-xs" type="button" title="Remove">×</button>`;
      row.querySelector('.fav-t').textContent = f.title;
      row.querySelector('.fav-u').textContent = hostOf(f.url);
      const btns = row.querySelectorAll('button');
      btns[0].addEventListener('click', () => {
        if (idx === 0) return;
        [prefs.favorites[idx - 1], prefs.favorites[idx]] = [prefs.favorites[idx], prefs.favorites[idx - 1]];
        savePrefs(); renderFavorites();
      });
      btns[1].addEventListener('click', () => {
        if (idx >= prefs.favorites.length - 1) return;
        [prefs.favorites[idx + 1], prefs.favorites[idx]] = [prefs.favorites[idx], prefs.favorites[idx + 1]];
        savePrefs(); renderFavorites();
      });
      btns[2].addEventListener('click', () => {
        prefs.favorites.splice(idx, 1);
        savePrefs(); renderFavorites();
      });
      list.appendChild(row);
    });
  }

  function renderAll() {
    document.body.classList.toggle('mica', prefs.mica);
    document.getElementById('view-minimal').classList.toggle('active', prefs.layout === 'minimal');
    document.getElementById('view-studio').classList.toggle('active', prefs.layout === 'studio');
    document.querySelectorAll('[data-layout]').forEach(b => b.classList.toggle('active', b.dataset.layout === prefs.layout));
    document.getElementById('bgBlackBtn').classList.toggle('active', !prefs.mica);
    document.getElementById('bgMicaBtn').classList.toggle('active', prefs.mica);

    document.querySelectorAll('[data-mod="logo"]').forEach(el => el.classList.toggle('hidden', !prefs.showLogo));
    document.querySelectorAll('[data-mod="clock"]').forEach(el => el.classList.toggle('hidden', !prefs.showClock));
    document.querySelectorAll('[data-mod="date"]').forEach(el => el.classList.toggle('hidden', !prefs.showDate));
    document.querySelectorAll('[data-mod="favorites"]').forEach(el => el.classList.toggle('hidden', !prefs.showFavorites));
    document.querySelectorAll('[data-mod="actions"]').forEach(el => el.classList.toggle('hidden', !prefs.showActions));

    document.querySelectorAll('[data-pref]').forEach(sw => {
      sw.classList.toggle('on', Boolean(prefs[sw.dataset.pref]));
    });

    const engineLabel = prefs.searxUrl ? 'SearXNG' : 'DuckDuckGo';
    document.querySelectorAll('[data-engine-label]').forEach(el => el.textContent = engineLabel);
    document.getElementById('studioEngineHint').textContent = prefs.searxUrl
      ? `SearXNG (${hostOf(prefs.searxUrl)})`
      : 'DuckDuckGo';
    document.getElementById('sdSearxIn').value = prefs.searxUrl;

    updateStudioIntent();
    updateClock();
    renderFavorites();
  }

  // Search forms & live intent
  const studioInput = document.getElementById('studioInput');
  const studioIntent = document.getElementById('studioIntent');
  function updateStudioIntent() {
    const v = studioInput.value.trim();
    if (v.startsWith('magnet:?')) studioIntent.textContent = 'TORRENT';
    else if (/^https?:\/\//i.test(v) || (v.includes('.') && !v.includes(' '))) studioIntent.textContent = 'URL';
    else studioIntent.textContent = prefs.searxUrl ? 'SEARXNG' : 'DDG';
  }
  studioInput.addEventListener('input', updateStudioIntent);

  document.querySelectorAll('[data-search-form]').forEach(form => {
    form.addEventListener('submit', e => {
      e.preventDefault();
      navigateInput(form.querySelector('[data-search-input]').value);
    });
  });

  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => triggerAction(btn.dataset.act));
  });

  // Inline SearXNG Popover
  function closeSearxPops() {
    document.querySelectorAll('[data-searx-pop]').forEach(p => p.classList.remove('open'));
  }
  function renderSearxPop(pop) {
    pop.innerHTML = `
      <div class="searx-row">
        <input class="field mono" style="flex:1" type="text" placeholder="http://localhost:8080 or https://searx.example" />
        <button type="button" class="flat-btn" data-p="http://localhost:8080">:8080</button>
        <button type="button" class="flat-btn" data-p="">DDG</button>
        <button type="button" class="flat-btn primary" data-sv>Save</button>
      </div>
      <div class="searx-meta">
        <span>Sets XNC search &amp; minimalist SearXNG theme</span>
        <span>Esc to close</span>
      </div>`;
    const inp = pop.querySelector('input');
    inp.value = prefs.searxUrl;
    pop.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
      setSearxng(b.dataset.p);
      closeSearxPops();
    }));
    const save = () => { setSearxng(inp.value); closeSearxPops(); };
    pop.querySelector('[data-sv]').addEventListener('click', save);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); save(); }
      if (e.key === 'Escape') closeSearxPops();
    });
  }
  function openSearxPop() {
    const activeView = document.querySelector('.view.active');
    const pop = activeView.querySelector('[data-searx-pop]');
    const wasOpen = pop.classList.contains('open');
    closeSearxPops();
    if (!wasOpen) {
      renderSearxPop(pop);
      pop.classList.add('open');
      setTimeout(() => pop.querySelector('input').focus(), 20);
    }
  }
  document.querySelectorAll('[data-toggle-searx], [data-open-searx]').forEach(b => {
    b.addEventListener('click', e => { e.stopPropagation(); openSearxPop(); });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('[data-search-wrap]')) closeSearxPops();
  });

  // Settings Drawer
  const drawer = document.getElementById('settingsDrawer');
  const drawerBg = document.getElementById('drawerBackdrop');
  const settingsBtn = document.getElementById('settingsBtn');
  function openDrawer() {
    closeSearxPops();
    drawer.classList.add('open');
    drawerBg.classList.add('open');
    settingsBtn.classList.add('open');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    drawerBg.classList.remove('open');
    settingsBtn.classList.remove('open');
  }
  settingsBtn.addEventListener('click', () => drawer.classList.contains('open') ? closeDrawer() : openDrawer());
  document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
  drawerBg.addEventListener('click', closeDrawer);

  document.querySelectorAll('[data-layout]').forEach(b => {
    b.addEventListener('click', () => {
      prefs.layout = b.dataset.layout;
      savePrefs();
      closeSearxPops();
      renderAll();
    });
  });
  document.getElementById('bgBlackBtn').addEventListener('click', () => setMica(false));
  document.getElementById('bgMicaBtn').addEventListener('click', () => setMica(true));

  document.querySelectorAll('[data-pref]').forEach(sw => {
    sw.addEventListener('click', () => {
      const k = sw.dataset.pref;
      prefs[k] = !prefs[k];
      savePrefs();
      renderAll();
    });
  });

  document.getElementById('favAddForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = document.getElementById('favTitleIn').value.trim();
    const urlRaw = document.getElementById('favUrlIn').value.trim();
    if (!urlRaw) return;
    const url = normalizeTargetURL(urlRaw);
    prefs.favorites.push({ title: title || hostOf(url), url });
    savePrefs();
    document.getElementById('favTitleIn').value = '';
    document.getElementById('favUrlIn').value = '';
    renderFavorites();
  });
  document.getElementById('resetFavsBtn').addEventListener('click', () => {
    prefs.favorites = structuredClone(DEFAULT_FAVS);
    savePrefs();
    renderFavorites();
  });

  document.getElementById('sdSearxSave').addEventListener('click', () => setSearxng(document.getElementById('sdSearxIn').value));
  document.getElementById('sdSearx8080').addEventListener('click', () => setSearxng('http://localhost:8080'));
  document.getElementById('sdSearxDDG').addEventListener('click', () => setSearxng(''));

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeDrawer(); closeSearxPops(); }
  });

  renderAll();
})();
</script>
</body>
</html>
